<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0f19" />
<title>You're offline — Collect Valor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0b0f19; color: #e7ecf5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .wrap { max-width: 340px; }
  .mark {
    width: 84px; height: 84px; margin: 0 auto 22px;
    border-radius: 22px; display: flex; align-items: center; justify-content: center;
    background: #0b0f19; border: 2px solid transparent;
    background-image: linear-gradient(#0b0f19,#0b0f19), linear-gradient(135deg,#22d3ee,#a855f7,#ec4899,#f5c518);
    background-origin: border-box; background-clip: padding-box, border-box;
    font-weight: 800; font-size: 34px;
    color: transparent;
  }
  .mark span {
    background: linear-gradient(135deg,#22d3ee,#a855f7,#ec4899,#f5c518);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #9aa6bd; line-height: 1.5; margin: 0 0 24px; font-size: 15px; }
  button {
    font: inherit; font-weight: 700; color: #0b0f19; cursor: pointer;
    border: 0; border-radius: 12px; padding: 12px 22px;
    background: linear-gradient(135deg,#22d3ee,#a855f7,#ec4899);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span>CV</span></div>
    <h1>You're offline</h1>
    <p>Collect Valor needs a connection to scan cards and pull live prices. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
