name: Create Collect Valor Journal draft

on:
  workflow_dispatch:
  schedule:
    # Monday, Wednesday, and Friday at 15:00 UTC.
    - cron: '0 15 * * 1,3,5'

permissions:
  issues: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_JOURNAL_MODEL: gpt-5-mini
        run: node scripts/generate-journal-draft.mjs > journal-draft.md
      - name: Create review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Journal draft: $(date -u +'%Y-%m-%d')" \
            --body-file journal-draft.md
